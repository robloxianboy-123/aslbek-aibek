<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aslbek AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.1/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#faf9f7;--fg:#1f1e1d;--panel:#ffffff;--border:#e5e2dc;--muted:#8a8681;--accent:#cc7a52;--accent-fg:#fff;--bubble-u:#f0ebe3;--bubble-a:#ffffff;--err:#c0392b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#191815;--fg:#f1efe9;--panel:#211f1c;--border:#36332e;--muted:#938d84;--accent:#d98a5f;--accent-fg:#1a1510;--bubble-u:#2b2824;--bubble-a:#211f1c;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#191815;--fg:#f1efe9;--panel:#211f1c;--border:#36332e;--muted:#938d84;--accent:#d98a5f;--accent-fg:#1a1510;--bubble-u:#2b2824;--bubble-a:#211f1c;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box}
.hidden{display:none !important}
#login{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px 28px;max-width:360px;width:100%;text-align:center}
.logo{width:56px;height:56px;margin:0 auto 14px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#b85c37);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:26px}
.card h1{font-size:20px;margin:0 0 4px}
.card p{color:var(--muted);font-size:14px;margin:0 0 16px}
.tabs{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.tab{flex:1;padding:8px;background:var(--bg);color:var(--muted);font-size:14px;border-radius:0;font-weight:600}
.tab.active{background:var(--accent);color:var(--accent-fg)}
input,select,textarea{font-family:inherit;font-size:15px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);padding:10px 12px;width:100%}
.row{margin-bottom:10px;text-align:left}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;background:var(--accent);color:var(--accent-fg);padding:10px 16px;font-size:15px;font-weight:600}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
#authError,#authNote{font-size:13px;margin-bottom:10px;text-align:left}
#authError{color:var(--err)}
#authNote{color:var(--muted)}
#app{flex:1;display:none;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
header .logo{width:30px;height:30px;font-size:14px;border-radius:9px;margin:0}
header b{font-size:15px}
header .sp{flex:1}
header select{width:auto;padding:6px 8px;font-size:13px}
header button{padding:6px 12px;font-size:13px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto;width:100%}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--bubble-u);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--bubble-a);border:1px solid var(--border);border-bottom-left-radius:4px}
.hint{color:var(--muted);text-align:center;font-size:13px;margin-top:40px}
footer{padding:10px 12px;border-top:1px solid var(--border);background:var(--panel)}
.inputrow{display:flex;gap:8px;max-width:760px;margin:0 auto}
.inputrow textarea{resize:none;max-height:120px}
.inputrow button{flex-shrink:0}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo">A</div>
    <h1 id="lgTitle">Aslbek AI</h1>
    <p id="lgSub">Sizning shaxsiy AI yordamchingiz</p>
    <div class="tabs">
      <button class="tab active" id="tabSignin">Kirish</button>
      <button class="tab" id="tabSignup">Ro'yxatdan o'tish</button>
    </div>
    <div class="row hidden" id="nameRow"><input id="nameInput" placeholder="Ismingiz"></div>
    <div class="row"><input id="emailInput" type="email" placeholder="Email"></div>
    <div class="row"><input id="passInput" type="password" placeholder="Parol"></div>
    <div class="row hidden" id="langRow"><select id="langInput"><option value="uz">O'zbekcha</option><option value="ru">Русский</option><option value="en">English</option></select></div>
    <div id="authError" class="hidden"></div>
    <div id="authNote" class="hidden"></div>
    <button id="authBtn" style="width:100%">Kirish</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">A</div>
    <b>Aslbek AI</b>
    <div class="sp"></div>
    <select id="langSwitch"><option value="uz">UZ</option><option value="ru">RU</option><option value="en">EN</option></select>
    <button class="ghost" id="clearBtn">🗑</button>
    <button class="ghost" id="signOutBtn">⎋</button>
  </header>
  <div id="chat"></div>
  <footer>
    <div class="inputrow">
      <textarea id="msgInput" rows="1" placeholder="Xabar yozing..."></textarea>
      <button id="sendBtn">➤</button>
    </div>
  </footer>
</div>

<script>
// ===== Supabase sozlamalari — shu ikki qiymatni o'zingiznikiga almashtiring =====
const SUPABASE_URL = "https://cxlbzovmlchyommsavwg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8qORYb5r7Kh6ihaiAUqIRg_LZKPU_uB";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STR = {
  uz:{title:"Aslbek AI", sub:"Sizning shaxsiy AI yordamchingiz", name:"Ismingiz", signin:"Kirish", signup:"Ro'yxatdan o'tish", placeholder:"Xabar yozing...", hint:"Suhbatni boshlash uchun xabar yozing", thinking:"Yozmoqda...", sys:"Sen Aslbek AI nomli do'stona va foydali AI yordamchisan. Foydalanuvchiga o'zi yozgan tilda javob ber.", err:"Xatolik yuz berdi, qayta urinib ko'ring.", confirmNote:"Ro'yxatdan o'tdingiz. Endi \"Kirish\" tugmasi orqali tizimga kiring."},
  ru:{title:"Aslbek AI", sub:"Ваш персональный ИИ-помощник", name:"Ваше имя", signin:"Войти", signup:"Регистрация", placeholder:"Напишите сообщение...", hint:"Напишите сообщение, чтобы начать", thinking:"Печатает...", sys:"Ты Aslbek AI — дружелюбный и полезный ИИ-помощник. Отвечай на языке, на котором пишет пользователь.", err:"Произошла ошибка, попробуйте снова.", confirmNote:"Регистрация прошла успешно. Теперь войдите через кнопку \"Войти\"."},
  en:{title:"Aslbek AI", sub:"Your personal AI assistant", name:"Your name", signin:"Sign in", signup:"Sign up", placeholder:"Message...", hint:"Send a message to start", thinking:"Thinking...", sys:"You are Aslbek AI, a friendly and helpful AI assistant. Reply in whichever language the user writes in.", err:"Something went wrong, please try again.", confirmNote:"Signed up successfully. Now sign in with the \"Sign in\" button."}
};
let lang = "uz", messages=[], mode="signin", uid=null;

function t(k){ return (STR[lang]||STR.uz)[k]; }
function applyLang(){
  document.getElementById('lgTitle').textContent = t('title');
  document.getElementById('lgSub').textContent = t('sub');
  document.getElementById('nameInput').placeholder = t('name');
  document.getElementById('tabSignin').textContent = t('signin');
  document.getElementById('tabSignup').textContent = t('signup');
  document.getElementById('authBtn').textContent = mode==='signin' ? t('signin') : t('signup');
  document.getElementById('msgInput').placeholder = t('placeholder');
  document.getElementById('langSwitch').value = lang;
  renderChat();
}
function renderChat(){
  const el = document.getElementById('chat');
  if(messages.length===0){ el.innerHTML = '<div class="hint">'+t('hint')+'</div>'; return; }
  el.innerHTML = messages.map(m=>'<div class="msg '+(m.role==='user'?'u':'a')+'">'+escapeHtml(m.content)+'</div>').join('');
  el.scrollTop = el.scrollHeight;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function showApp(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').style.display='flex';
}
function showAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg; el.classList.remove('hidden');
  document.getElementById('authNote').classList.add('hidden');
}
function showAuthNote(msg){
  const el = document.getElementById('authNote');
  el.textContent = msg; el.classList.remove('hidden');
  document.getElementById('authError').classList.add('hidden');
}

function setMode(m){
  mode = m;
  document.getElementById('tabSignin').classList.toggle('active', m==='signin');
  document.getElementById('tabSignup').classList.toggle('active', m==='signup');
  document.getElementById('nameRow').classList.toggle('hidden', m!=='signup');
  document.getElementById('langRow').classList.toggle('hidden', m!=='signup');
  document.getElementById('authError').classList.add('hidden');
  document.getElementById('authNote').classList.add('hidden');
  applyLang();
}
document.getElementById('tabSignin').addEventListener('click', ()=>setMode('signin'));
document.getElementById('tabSignup').addEventListener('click', ()=>setMode('signup'));

async function loadProfileAndMessages(){
  const { data: prof } = await sb.from('profiles').select('*').eq('id', uid).single();
  if(prof && prof.lang){ lang = prof.lang; }
  const { data: msgs } = await sb.from('messages').select('*').eq('user_id', uid).order('created_at', {ascending:true});
  messages = (msgs||[]).map(m=>({role:m.role, content:m.content}));
}

document.getElementById('authBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value;
  if(!email || !pass){ showAuthError('Email va parolni kiriting'); return; }
  if(mode==='signup'){
    const name = document.getElementById('nameInput').value.trim();
    const l = document.getElementById('langInput').value;
    if(!name){ showAuthError('Ismingizni kiriting'); return; }
    const { data, error } = await sb.auth.signUp({ email, password: pass });
    if(error){ showAuthError(error.message); return; }
    if(data.session){
      uid = data.user.id;
      await sb.from('profiles').upsert({ id: uid, name, lang: l });
      lang = l; messages = [];
      showApp(); applyLang();
    } else {
      showAuthNote(t('confirmNote'));
      setMode('signin');
    }
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ showAuthError(error.message); return; }
    uid = data.user.id;
    await loadProfileAndMessages();
    showApp(); applyLang();
  }
});

document.getElementById('langSwitch').addEventListener('change', async e=>{
  lang = e.target.value; applyLang();
  if(uid){ try{ await sb.from('profiles').update({lang}).eq('id', uid); }catch(e){} }
});
document.getElementById('signOutBtn').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  uid = null; messages = [];
  document.getElementById('app').style.display='none';
  document.getElementById('login').classList.remove('hidden');
});
document.getElementById('clearBtn').addEventListener('click', async ()=>{
  messages=[]; renderChat();
  if(uid){ try{ await sb.from('messages').delete().eq('user_id', uid); }catch(e){} }
});

async function send(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !uid) return;
  input.value='';
  messages.push({role:'user', content:text});
  renderChat();
  try{ await sb.from('messages').insert({ user_id: uid, role:'user', content:text }); }catch(e){}
  const chatEl = document.getElementById('chat');
  const thinkingDiv = document.createElement('div');
  thinkingDiv.className='msg a'; thinkingDiv.textContent=t('thinking');
  chatEl.appendChild(thinkingDiv); chatEl.scrollTop=chatEl.scrollHeight;
  const convo = [{role:'user', content: t('sys')}, {role:'assistant', content:'OK.'}];
  for(const m of messages){ convo.push({role:m.role, content:m.content}); }
  let reply = t('err');
  try{
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ messages: convo })
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.error || 'request failed'); }
    reply = (data.content && data.content.find(b=>b.type==='text') || {}).text || t('err');
  }catch(err){}
  messages.push({role:'assistant', content: reply});
  renderChat();
  try{ await sb.from('messages').insert({ user_id: uid, role:'assistant', content:reply }); }catch(e){}
}
document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('msgInput').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

(async function(){
  applyLang();
  const { data } = await sb.auth.getSession();
  if(data.session){
    uid = data.session.user.id;
    await loadProfileAndMessages();
    showApp(); applyLang();
  }
})();
</script>
</body>
</html>
